[project]
name = "iris"
version = "0.1.0"
description = "iris"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "typer>=0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = []

[tool.ruff]
target-version = "py312"    # Set to your minimum supported Python version
line-length = 88            # Black-compatible default
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # Ruff-specific rules
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "PERF",   # Perflint
    "FURB",   # refurb
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments (can be noisy)
    "PLR2004", # Magic value comparisons (can be noisy)
]

# Allow autofix for all enabled rules (when `--fix` is passed)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+_*))$"

[tool.ruff.lint.isort]
known-first-party = ["iris"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"] # Remove if not using FastAPI

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Allow assert in tests
    "PLR2004",  # Allow magic values in tests
    "ANN",      # Don't require type annotations in tests
]
"scripts/**/*.py" = ["T201"] # Allow print() in scripts

[tool.mypy]
python_version = "3.12"         # Match your target Python version
strict = true                   # Enables a broad set of strict checks

# Strict mode enables these (listed for visibility):
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# Cleaner error output
show_error_codes = true
show_column_numbers = true
pretty = true

# Helpful for catching issues in large codebases
no_implicit_reexport = true

# Per-module overrides for third-party libs without stubs
[[tool.mypy.overrides]]
module = [
    "some_untyped_lib.*",   # Replace with actual untyped dependencies
]
ignore_missing_imports = true
